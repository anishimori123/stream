<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stream</title>
  <meta name="description" content="Atsushi's Japan TV and learning player">
  <meta name="theme-color" content="#14161a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot"></span>Stream <span class="ver" id="ver"></span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="tv" aria-selected="true">Japan TV</button>
      <button role="tab" data-tab="learn" aria-selected="false">Learning</button>
    </nav>
  </header>

  <main>
    <section id="tab-tv" class="tab">
      <div class="player-wrap">
        <video id="video" controls playsinline></video>
        <div id="status" class="status">Pick a channel below</div>
      </div>
      <h2 id="now" class="now"></h2>
      <ul id="tv-list" class="list"></ul>
    </section>

    <section id="tab-learn" class="tab" hidden>
      <p class="hint">Interviews with tech leaders. Tap one to open it on YouTube.</p>
      <ul id="learn-list" class="list"></ul>

      <h3 class="sub">My list</h3>
      <p class="hint">Add your own videos. Saved on this device only.</p>
      <form id="add-form" class="add">
        <input id="add-name" placeholder="Name (e.g. Jensen at Computex)" required>
        <input id="add-url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
        <button type="submit">Add</button>
      </form>
      <ul id="my-list" class="list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
