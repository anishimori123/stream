name: Update podcast episodes

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch: {} # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - podcasts-config.json
      - scripts/update-podcasts.mjs
      - .github/workflows/podcasts.yml

permissions:
  contents: write

concurrency:
  group: podcasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch feeds
        run: node scripts/update-podcasts.mjs
      - name: Save changes
        run: |
          if git diff --quiet -- podcasts.json; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcasts.json
          git commit -m "Update podcast episodes"
          git pull --rebase origin main
          git push
